# Blueprint de Render (https://render.com/docs/blueprint-spec)
# Crear el servicio desde el dashboard con "New > Blueprint" apuntando a este repo.
services:
  - type: web
    name: practica-final-devops
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    # Desactivado a proposito: quien dispara el despliegue es el job "deploy"
    # del workflow de GitHub Actions, llamando al Deploy Hook. Si Render
    # tambien desplegara por su cuenta en cada commit, habria dos despliegues
    # compitiendo por cada push.
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
