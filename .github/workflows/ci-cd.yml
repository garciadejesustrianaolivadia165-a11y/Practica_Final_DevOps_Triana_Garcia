name: CI/CD

# Se ejecuta en cada push a main, en los pull request y de forma manual
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: practica-final-devops
  NODE_VERSION: '22'
  # El usuario de Docker Hub y la URL publica no son datos confidenciales:
  # van aqui a la vista. Los unicos secretos reales son DOCKERHUB_TOKEN y
  # RENDER_DEPLOY_HOOK_URL, que si dan acceso de escritura.
  DOCKERHUB_USER: trianagarcia
  APP_URL: https://practica-final-devops-tj2y.onrender.com

jobs:
  # ------------------------------------------------------------------
  # 1) Instalar dependencias + ejecutar la prueba unitaria
  # ------------------------------------------------------------------
  test:
    name: Instalar dependencias y ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test -- --ci --reporters=default

      - name: Generar informe de cobertura
        run: npm run test:coverage -- --ci

      - name: Guardar la cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  # ------------------------------------------------------------------
  # 2) Construir la imagen y subirla a Docker Hub
  # ------------------------------------------------------------------
  docker:
    name: Construir y publicar en Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    outputs:
      publicada: ${{ steps.credenciales.outputs.disponibles }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Comprobar credenciales de Docker Hub
        id: credenciales
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "disponibles=true" >> "$GITHUB_OUTPUT"
            echo "Token encontrado: la imagen se subira a $DOCKERHUB_USER/$IMAGE_NAME."
          else
            echo "disponibles=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secreto DOCKERHUB_TOKEN. La imagen se construye pero NO se sube."
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        if: steps.credenciales.outputs.disponibles == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.credenciales.outputs.disponibles == 'true' }}
          load: ${{ steps.credenciales.outputs.disponibles != 'true' }}
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          if [ "${{ steps.credenciales.outputs.disponibles }}" = "true" ]; then
            {
              echo "### Imagen publicada en Docker Hub"
              echo ""
              echo '```bash'
              echo "docker pull ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Imagen construida pero NO publicada (faltan secretos)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ------------------------------------------------------------------
  # 3) Publicar la aplicacion en produccion (Render)
  # ------------------------------------------------------------------
  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    environment:
      name: production
      url: ${{ env.APP_URL }}

    steps:
      - name: Lanzar el despliegue en Render
        id: hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Falta el secreto RENDER_DEPLOY_HOOK_URL. No se despliega."
            echo "lanzado=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          codigo=$(curl -sS -o respuesta.txt -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Codigo HTTP: $codigo"
          cat respuesta.txt

          if [ "$codigo" -ge 200 ] && [ "$codigo" -lt 300 ]; then
            echo "lanzado=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Render devolvio el codigo $codigo"
            exit 1
          fi

      - name: Esperar a que la aplicacion responda
        if: steps.hook.outputs.lanzado == 'true'
        run: |
          url="${{ env.APP_URL }}"
          echo "Comprobando $url/health durante 5 minutos..."

          for intento in $(seq 1 30); do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url/health" || echo 000)
            if [ "$codigo" = "200" ]; then
              echo "Aplicacion en linea (intento $intento)."
              {
                echo "### Aplicacion desplegada"
                echo ""
                echo "- URL: $url"
                echo "- Health: $url/health"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Intento $intento: HTTP $codigo, reintentando en 10s..."
            sleep 10
          done

          echo "::warning::La aplicacion no respondio 200 en 5 minutos. Render puede seguir construyendo."
